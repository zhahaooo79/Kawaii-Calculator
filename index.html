<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>萌萌計算機｜Kawaii Calculator</title>
<style>
:root{font-family:ui-rounded,'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;color:#6e4561;background:#fff6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 16px;background:radial-gradient(circle at 10% 10%,var(--glow),transparent 35%),radial-gradient(circle at 90% 90%,var(--glow),transparent 36%),var(--page);transition:background .3s}body[data-theme=pink]{--page:#fff6fa;--panel:#ffe2ee;--key:#fff;--accent:#f67fac;--ink:#74425f;--glow:#ffd5e8}body[data-theme=blue]{--page:#f1f9ff;--panel:#d9edff;--key:#fff;--accent:#6eadeb;--ink:#365d83;--glow:#d1e9ff}body[data-theme=yellow]{--page:#fffbeb;--panel:#ffefb9;--key:#fffefa;--accent:#eebc4e;--ink:#7a6132;--glow:#fff0ba}body[data-theme=mint]{--page:#f0fff8;--panel:#d7f6e8;--key:#fff;--accent:#67c7a2;--ink:#376959;--glow:#c9f4df}body{color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.wrap{max-width:870px;margin:auto}.heading{text-align:center;margin-bottom:25px}.heading h1{font-size:clamp(28px,5vw,40px);margin:0}.heading p{opacity:.7;margin:8px 0}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);gap:23px;align-items:start}.calculator,.custom{background:var(--panel);border:3px solid #ffffffb8;border-radius:34px;box-shadow:0 18px 45px #5d42601a;padding:23px}.mascot{text-align:center;min-height:116px}.animal{font-size:62px;display:inline-block;line-height:1.12;transform-origin:center}.animal.bounce{animation:bounce .5s ease}.mascot p{font-size:15px;font-weight:700;margin:5px 0 13px}.screen{background:#ffffffdb;border-radius:22px;min-height:108px;padding:14px 18px;text-align:right;display:flex;flex-direction:column;justify-content:center;overflow:hidden;box-shadow:inset 0 3px 9px #0000000a}.expression{font-size:15px;opacity:.58;min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result{font-size:clamp(28px,6vw,42px);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px}.key{border:0;border-radius:18px;background:var(--key);box-shadow:0 4px 0 #00000012;min-height:62px;color:var(--ink);font-size:23px;font-weight:750;transition:transform .12s,box-shadow .12s}.key:active{transform:translateY(3px);box-shadow:0 1px 0 #00000016}.operator{background:#ffffff8f;color:var(--ink)}.special{background:#ffffffad;font-size:19px}.equal{background:var(--accent);color:white}.custom h2{font-size:21px;margin:3px 0 8px}.custom .hint{font-size:13px;opacity:.75;line-height:1.6;margin:0 0 23px}.section-title{font-weight:750;font-size:15px;margin:17px 0 10px}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.theme{height:49px;border-radius:14px;border:3px solid #ffffff;background:var(--swatch);font-size:21px;box-shadow:0 2px 6px #0000000b}.theme[aria-pressed=true],.pet[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pet{background:#ffffffbd;border:0;border-radius:15px;min-height:62px;font-size:30px}.selection{padding-top:11px;font-size:13px;opacity:.7}.tip{margin-top:20px;padding:14px;background:#ffffffa8;border-radius:15px;font-size:13px;line-height:1.65}.footer{text-align:center;font-size:12px;opacity:.5;margin-top:25px}@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-13px) scale(1.12)}70%{transform:translateY(0) scale(.94)}}@media(max-width:650px){body{padding:20px 12px}.layout{grid-template-columns:1fr;gap:15px}.calculator,.custom{padding:18px;border-radius:27px}.key{min-height:58px}.mascot{min-height:104px}.custom h2{margin-top:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-theme="pink">
<div class="wrap"><header class="heading"><h1>✿ 萌萌計算機 ✿</h1><p>和小夥伴一起，開心算數學！</p></header><main class="layout"><section class="calculator" aria-label="計算機"><div class="mascot" aria-live="polite"><span class="animal" id="animal">🐻</span><p id="message">今天想算什麼呢？ ♡</p></div><div class="screen" aria-live="polite"><div class="expression" id="expression">準備好了 ✨</div><div class="result" id="result">0</div></div><div class="keys" aria-label="計算機按鍵"><button class="key special" data-action="clear">AC</button><button class="key special" data-action="delete" aria-label="刪除一位">⌫</button><button class="key special" data-action="sign" aria-label="正負切換">±</button><button class="key operator" data-action="operator" data-value="÷">÷</button><button class="key" data-action="digit" data-value="7">7</button><button class="key" data-action="digit" data-value="8">8</button><button class="key" data-action="digit" data-value="9">9</button><button class="key operator" data-action="operator" data-value="×">×</button><button class="key" data-action="digit" data-value="4">4</button><button class="key" data-action="digit" data-value="5">5</button><button class="key" data-action="digit" data-value="6">6</button><button class="key operator" data-action="operator" data-value="−">−</button><button class="key" data-action="digit" data-value="1">1</button><button class="key" data-action="digit" data-value="2">2</button><button class="key" data-action="digit" data-value="3">3</button><button class="key operator" data-action="operator" data-value="+">+</button><button class="key special" data-action="percent">%</button><button class="key" data-action="digit" data-value="0">0</button><button class="key" data-action="dot">.</button><button class="key equal" data-action="equals">=</button></div></section><aside class="custom"><h2>🎨 我的計算機換裝室</h2><p class="hint">幫計算機換上喜歡的顏色，再挑一位陪你算數學的小夥伴！</p><div class="section-title">① 選擇魔法配色</div><div class="themes"><button class="theme" style="--swatch:#ffd7e7" data-theme="pink" aria-label="草莓粉" aria-pressed="true" title="草莓粉">🍓</button><button class="theme" style="--swatch:#cde8ff" data-theme="blue" aria-label="天空藍" aria-pressed="false" title="天空藍">☁️</button><button class="theme" style="--swatch:#ffedab" data-theme="yellow" aria-label="奶油黃" aria-pressed="false" title="奶油黃">🌼</button><button class="theme" style="--swatch:#cbf3df" data-theme="mint" aria-label="薄荷綠" aria-pressed="false" title="薄荷綠">🍀</button></div><div class="section-title">② 選擇陪伴小夥伴</div><div class="pets"><button class="pet" data-pet="🐻" aria-label="小熊" aria-pressed="true">🐻</button><button class="pet" data-pet="🐰" aria-label="小兔" aria-pressed="false">🐰</button><button class="pet" data-pet="🐱" aria-label="小貓" aria-pressed="false">🐱</button><button class="pet" data-pet="🐥" aria-label="小鴨" aria-pressed="false">🐥</button></div><div class="selection" id="selection">目前：草莓粉 × 小熊</div><div class="tip">💡 <b>小驚喜：</b>計算成功時，小夥伴會開心跳一下！如果試著除以 0，牠會疑惑地提醒你喔。</div></aside></main><div class="footer">Made with ♡ · Kawaii Calculator</div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),result=$('result'),expression=$('expression'),message=$('message'),animal=$('animal');
const themeNames={pink:'草莓粉',blue:'天空藍',yellow:'奶油黃',mint:'薄荷綠'},petNames={'🐻':'小熊','🐰':'小兔','🐱':'小貓','🐥':'小鴨'};
let theme='pink',pet='🐻';
try{let saved=JSON.parse(localStorage.getItem('kawaii-prefs')||'{}');if(themeNames[saved.theme])theme=saved.theme;if(petNames[saved.pet])pet=saved.pet}catch(e){}
function appearance(){document.body.dataset.theme=theme;animal.textContent=pet;document.querySelectorAll('[data-theme].theme').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelectorAll('[data-pet]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pet===pet)));$('selection').textContent=`目前：${themeNames[theme]} × ${petNames[pet]}`;try{localStorage.setItem('kawaii-prefs',JSON.stringify({theme,pet}))}catch(e){}}
document.querySelectorAll('.theme').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;appearance()}));document.querySelectorAll('.pet').forEach(b=>b.addEventListener('click',()=>{pet=b.dataset.pet;appearance();say('你好呀！一起算數學 ♡',true)}));appearance();
let current='0',previous=null,operator=null,waiting=false,lastExpression='準備好了 ✨',error=false;
function say(s,bounce=false){message.textContent=s;if(bounce){animal.classList.remove('bounce');void animal.offsetWidth;animal.classList.add('bounce')}}
function update(){result.textContent=current;expression.textContent=operator!==null?`${previous} ${operator}`:lastExpression;}
function reset(){current='0';previous=null;operator=null;waiting=false;lastExpression='準備好了 ✨';error=false;say('今天想算什麼呢？ ♡');update()}
function digit(n){if(error)reset();if(waiting){current=n;waiting=false;if(operator===null)lastExpression='輸入中…'}else if(current.replace(/[-.]/g,'').length<12){current=current==='0'?n:current==='-0'?'-'+n:current+n}say('繼續加油～');update()}
function dot(){if(error)reset();if(waiting){current='0.';waiting=false}else if(!current.includes('.'))current+='.';update()}
function sign(){if(error)return;current=current.startsWith('-')?current.slice(1):current==='0'?'0':'-'+current;update()}
function percent(){if(error)return;current=String(Number(current)/100);update()}
function del(){if(error){reset();return}if(waiting){current='0';waiting=false}else current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1);update()}
function calculate(a,b,op){const x=Number(a),y=Number(b);if(op==='÷'&&y===0)return null;let ans=op==='+'?x+y:op==='−'?x-y:op==='×'?x*y:x/y;return Number.isFinite(ans)?Number(ans.toPrecision(12)).toString():null}
function problem(){current='不能除以 0';previous=null;operator=null;waiting=true;error=true;lastExpression='咦？這樣算不出來耶';say('🤔 0 不能當除數喔！');update()}
function chooseOperator(op){if(error)reset();if(operator!==null&&!waiting){const answer=calculate(previous,current,operator);if(answer===null){problem();return}current=answer}previous=current;operator=op;waiting=true;say('下一個數字是什麼呢？');update()}
function equals(){if(error||operator===null)return;const shown=`${previous} ${operator} ${current} =`;const answer=calculate(previous,current,operator);if(answer===null){problem();return}current=answer;previous=null;operator=null;waiting=true;lastExpression=shown;say('✨ 算出來啦！你好棒！',true);update()}
const actions={digit:b=>digit(b.dataset.value),dot,sign,percent,delete:del,clear:reset,operator:b=>chooseOperator(b.dataset.value),equals};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.action](b)));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target instanceof HTMLButtonElement&&['Enter',' '].includes(e.key))return;const k=e.key;if(/^\d$/.test(k))digit(k);else if(k==='.')dot();else if(k==='+')chooseOperator('+');else if(k==='-')chooseOperator('−');else if(k==='*'||k.toLowerCase()==='x')chooseOperator('×');else if(k==='/'){e.preventDefault();chooseOperator('÷')}else if(k==='Enter'||k==='='){e.preventDefault();equals()}else if(k==='Backspace'){e.preventDefault();del()}else if(k==='Escape')reset();else if(k==='%')percent()});
update();
})();
</script>
</body>
</html>
